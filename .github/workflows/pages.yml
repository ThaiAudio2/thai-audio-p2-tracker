name: Deploy tracker to GitHub Pages

# Publishes the static tracker (index.html + assets/) to GitHub Pages on every
# push to this branch. Live URL: https://ppakawat1997-dev.github.io/HOBI_Seminar/
# One-time: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - claude/new-repo-netlify-fsdmwa
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
